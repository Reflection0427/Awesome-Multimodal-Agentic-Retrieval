name: Discover Multimodal Retrieval Papers

on:
  schedule:
    # Every Monday at 02:23 UTC (10:23 Asia/Shanghai).
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: multimodal-paper-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Search scholarly indexes
        id: scan
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          PAPER_TRACKER_EMAIL: ${{ vars.PAPER_TRACKER_EMAIL }}
        run: |
          python scripts/discover_papers.py
          cat .paper-tracker/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate candidate data and generated collection
        run: |
          python scripts/generate_readme.py --check
          python -m unittest discover -s tests -v

      - name: Upload review report
        uses: actions/upload-artifact@v7
        with:
          name: multimodal-paper-candidate-report
          path: .paper-tracker/
          include-hidden-files: true
          retention-days: 30

      - name: Create or update candidate pull request
        id: candidate_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: automation/multimodal-paper-candidates
          delete-branch: false
          commit-message: "chore: refresh paper candidates"
          title: "Review newly discovered multimodal retrieval papers"
          body: |
            The scheduled tracker found or refreshed candidate papers.

            This PR only changes `data/candidates.json`. Before merging a paper into the public list, a reviewer must:

            1. verify the paper, venue, URL and relevance;
            2. select the correct section;
            3. write a neutral one-sentence summary;
            4. supply 3–5 framework steps;
            5. run `scripts/accept_candidate.py`, then validate generated files.

            Nothing in this PR is published to the README automatically.
          labels: |
            paper-candidates
            automated

      - name: Report result
        run: |
          echo "Candidate count: ${{ steps.scan.outputs.candidate_count }}"
          echo "Pull request: ${{ steps.candidate_pr.outputs.pull-request-url }}"
